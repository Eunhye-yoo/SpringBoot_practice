<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>게시판</h1>
    <table border="1">
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="board:${boards}">
                <td th:text="${board.bno}"></td>
                <td>
                    <span th:if="${board.isNotice}" style="color: red;">
                        [공지]
                    </span>
                    <span th:text="${board.title}"></span>
                </td>
                <td th:text="${board.wirter}"></td>
                <!--
                #temporals : 타임리프가 가진 LocalDateTime 포맷팅 객체
                #dates : Date 포맷팅 객체
                #strings : 문자열 관련 함수들을 가진 객체
                #lists, #maps : 각 자료형에서 제공하는 기능들을 가진 객체
                -->
                <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
        </tbody>

    </table>
</body>
</html>
